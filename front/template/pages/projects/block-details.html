<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        color: #333;
        margin: 0;
        padding: 0;

        color: white;
        padding: 10px;
        text-align: center;
    }
    .container {
        padding: 20px;
    }
    .card {
        border: 1px solid #ccc;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
    }
    .card-title {
        font-size: 1.5em;
        margin-bottom: 10px;
    }
    .btn {
        border-radius: 5px;
        padding: 8px 15px;
        font-size: 0.9em;
    }
    .btn-primary {
        background-color: #007BFF;
        color: white;
    }
    .btn-primary:hover {
        background-color: #0056b3;
    }
    .table {
        width: 100%;
        margin-bottom: 1rem;
        color: #212529;
    }
    .table th,
    .table td {
        padding: 0.75rem;
        vertical-align: top;
        border-top: 1px solid #dee2e6;
    }
</style>

<body>
    <!-- PAGE -->
    <div class="page">
        <!-- HEADER -->
        <header class="app-header" id="static-header">
            <!-- DİNAMİK DOLUYOR -->
        </header>
        <!-- END HEADER -->

        <!-- SIDEBAR -->
        <aside class="app-sidebar sticky" id="static-sidebar">
            <!-- DİNAMİK DOLUYOR -->
        </aside>
        <!-- END SIDEBAR -->

        <!-- MAIN CONTENT -->
        <div class="main-content app-content">
            <div class="container-fluid">
                <!-- Ürün Kullanımı ve Tablosu (Yan Yana) -->
                <div class="row">
                    <!-- Ürün Kullanımı Grafiği -->
                    <div class="col-md-6 mb-4">
                        <div class="chart-container">
                            <h5>Ürün Kullanımı (Stok Bazlı)</h5>
                            <canvas id="pieChart"></canvas>
                        </div>
                    </div>

                    <!-- Ürün Kullanımı Tablosu -->
                    <div class="col-md-6 mb-4">
                        <div class="chart-container" id="product-usage-table">
                            <h5>Ürün Kullanımı Tablosu</h5>
                            <div class="table-responsive">
                                <table id="product-usage-table" class="table">
                                    <thead>
                                        <tr>
                                            <th>Ürün Adı</th>
                                            <th>Adet</th>
                                            <th>Stok Durumu</th>
                                        </tr>
                                    </thead>
                                    <tbody id="product-usage-list"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Satış Grafiği ve Satış Aktiviteleri (Yan Yana) -->
                <div class="row">
                    <!-- Satış Grafiği -->
                    <div class="col-md-6 mb-4">
                        <div class="chart-container">
                            <h5>Satış Grafiği (Günlük Satışlar)</h5>
                            <canvas id="salesChart"></canvas>
                        </div>
                    </div>

                    <!-- Satış Aktiviteleri Tablosu -->
                    <div class="col-md-6 mb-4">
                        <div class="chart-container" id="sales-activities">
                            <h5>Satış Aktiviteleri</h5>
                            <div class="table-responsive">
                                <table id="sales-activity-table" class="table">
                                    <thead>
                                        <tr>
                                            <th>Şirket Adı</th>
                                            <th>Ödeme Durumu</th>
                                            <th>Tarih</th>
                                        </tr>
                                    </thead>
                                    <tbody id="sales-activity-list"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <style>
            /* Genel Ana İçerik Alanı */
            .main-content {
                padding: 40px 0;
                background-color: #f8f9fa;
            }

            /* Başlıklar */
            .chart-container h5 {
                font-size: 18px;
                font-weight: 600;
                margin-bottom: 15px;
                color: #343a40;
            }

            /* Grafik Alanları */
            .chart-container {
                background-color: #ffffff;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }

            /* Grafiklerin Konteyneri */
            canvas {
                width: 100% !important;
                height: 300px !important;
                border-radius: 8px;
            }

            /* Satır ve Kolon Düzeni */
            .row {
                display: flex;
                gap: 20px;
                flex-wrap: wrap;
            }

            .col-md-6 {
                flex: 1;
                min-width: 280px;
            }

            /* Tablo Stilleri */
            .table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 10px;
            }

            .table th,
            .table td {
                padding: 12px 18px;
                font-size: 14px;
                text-align: left;
                border-bottom: 1px solid #e9ecef;
            }

            .table th {
                background-color: #007bff;
                color: white;
            }

            .table tbody tr:nth-child(odd) {
                background-color: #f9f9f9;
            }

            .table tbody tr:hover {
                background-color: #f1f1f1;
            }

            /* Tablo Başlıkları */
            .table-responsive {
                overflow-x: auto;
                margin-top: 10px;
            }

            /* Mobil Uyumlu */
            @media (max-width: 768px) {
                .row {
                    flex-direction: column;
                    gap: 20px;
                }

                .col-md-6 {
                    min-width: 100%;
                }

                .chart-container h5 {
                    font-size: 16px;
                }
            }
        </style>
        <!-- END MAIN CONTENT -->

        <!-- FOOTER -->
        <footer class="footer mt-auto py-3 bg-white text-center" id="static-footer">
